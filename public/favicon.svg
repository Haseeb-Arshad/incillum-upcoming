<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Incillum">
  <!--
    The mark: a serif capital I, drawn as geometry rather than set as text.

    A <text> element in a favicon renders in whatever the viewer's system
    considers a serif, so the one glyph that is supposed to be the brand would
    look different in every browser. Three rectangles always look the same.

    The proportions are the display face's own: a stem a little under a fifth of
    the cap height, and slab serifs that overhang it by the same amount on each
    side. It reads at 16px, which is the only size that actually matters.
  -->
  <rect width="32" height="32" rx="6" fill="#111110" />
  <rect x="9" y="8" width="14" height="2.6" fill="#f7f7f5" />
  <rect x="14.4" y="8" width="3.2" height="16" fill="#f7f7f5" />
  <rect x="9" y="21.4" width="14" height="2.6" fill="#f7f7f5" />
</svg>
